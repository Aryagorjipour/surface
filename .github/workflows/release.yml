name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        name: Publish
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
            packages: write
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Vulnerability check
              run: bash scripts/govulncheck.sh

            - name: Build release binaries
              run: bash scripts/release-build.sh "${GITHUB_REF_NAME}" dist

            - name: Attest build provenance
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: dist/*

            - name: Publish GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: bash scripts/release-publish.sh "${GITHUB_REF_NAME}" dist

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push connector image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: deployments/Dockerfile.connector
                  push: true
                  tags: |
                      ghcr.io/aryagorjipour/surface-connector:${{ github.ref_name }}
                      ghcr.io/aryagorjipour/surface-connector:latest
                  labels: |
                      org.opencontainers.image.source=https://github.com/Aryagorjipour/surface
                      org.opencontainers.image.description=Surface Connector (rendezvous + signaling)
                      org.opencontainers.image.licenses=MIT
